<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav site-nav--desktop" aria-label="Main navigation">
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="is-current" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>

    <div class="site-navigation">
      <button
        class="site-nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="mobile-navigation">
        <span>Menu</span>
        <span class="site-nav-toggle__icon" aria-hidden="true"></span>
      </button>
      <nav
        class="site-nav site-nav--mobile"
        id="mobile-navigation"
        aria-label="Main navigation"
        hidden>
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="is-current" aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </div>
</header>
